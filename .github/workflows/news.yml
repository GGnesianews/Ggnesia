name: GGNesia News Auto Update

on:
  schedule:
    # Berjalan setiap jam
    - cron: "0 * * * *"

  # Bisa dijalankan manual dari GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:

    runs-on: ubuntu-latest

    steps:

      # 1. Ambil kode repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Siapkan Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Jalankan mesin pengambil berita
      - name: Update gaming news
        run: npm run update-news

      # 4. Simpan berita baru ke repository
      - name: Commit updated news
        run: |

          git config --global user.name "GGNesia News Bot"

          git config --global user.email "ggnesia-news-bot@users.noreply.github.com"

          git add data/articles.json

          git diff --cached --quiet || git commit -m "Auto update gaming news"

          git push
